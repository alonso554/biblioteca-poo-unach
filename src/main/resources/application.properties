spring.application.name=Biblioteca

spring.datasource.url=${BIBLIOTECA_DB_URL:jdbc:mariadb://localhost:3306/biblioteca_poo}
spring.datasource.username=${BIBLIOTECA_DB_USER:root}
spring.datasource.password=${BIBLIOTECA_DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.community.dialect.MariaDBLegacyDialect
spring.jpa.open-in-view=false

server.port=8080

# Los detalles internos y valores rechazados no se incluyen en respuestas de error.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Procedimiento local de un solo uso; el arranque normal nunca crea cuentas.
biblioteca.admin-inicial.habilitado=${BIBLIOTECA_ADMIN_INICIAL_HABILITADO:false}
biblioteca.admin-inicial.accion=${BIBLIOTECA_ADMIN_INICIAL_ACCION:revisar}

# 0 obliga al ADMIN a elegir la fecha límite; no se supone un plazo oficial.
biblioteca.prestamos.plazo-dias=${BIBLIOTECA_PRESTAMO_PLAZO_DIAS:0}
# Lista separada por comas; vacía valida el formato y requiere verificación del personal.
biblioteca.prestamos.dominios-correo=${BIBLIOTECA_CORREO_DOMINIOS:}
