<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragmentos :: cabecera('Ficha de lector')}"></head><body><header th:replace="~{fragmentos :: encabezado}"></header><main class="contenido"><h1 th:text="${lector.nombreCompleto}">Lector</h1><p><strong>Matrícula:</strong> <span th:text="${lector.matricula}"></span> · <span th:text="${lector.correoInstitucional}"></span></p><section class="resumen-historial"><span><strong th:text="${consulta.resumen.entregados}"></strong> préstamos entregados</span><span><strong th:text="${consulta.resumen.activos}"></strong> en su poder</span><span><strong th:text="${consulta.resumen.vencidos}"></strong> préstamos vencidos</span><span><strong th:text="${consulta.resumen.devolucionesTardias}"></strong> devoluciones tardías</span><span><strong th:text="${consulta.resumen.incidenciasPendientes}"></strong> incidencias pendientes</span><span><strong th:text="${consulta.resumen.incidenciasResueltas}"></strong> resueltas</span></section><p class="mensaje error" th:if="${consulta.resumen.vencidos > 0}" th:text="${consulta.resumen.vencidos + ' préstamos vencidos'}"></p><p class="mensaje error" th:if="${consulta.resumen.incidenciasPendientes > 0}" th:text="${consulta.resumen.incidenciasPendientes + ' incidencias pendientes'}"></p><form class="acciones" method="get"><label>Desde (fecha de solicitud) <input class="form-control" type="date" name="desde" th:value="${desde}"></label><label>Hasta <input class="form-control" type="date" name="hasta" th:value="${hasta}"></label><select name="estado"><option value="">Todos los estados</option><option th:each="e : ${T(com.UNACH.Biblioteca.model.EstadoPrestamo).values()}" th:value="${e}" th:text="${e}" th:selected="${e == estado}"></option></select><button class="boton">Filtrar</button></form><div class="tabla-contenedor table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Libro / ejemplar</th><th>Fechas</th><th>Estado</th><th>Atraso</th><th>Incidencias</th></tr></thead><tbody><tr th:each="fila : ${consulta.registros.content}"><td><a th:href="@{/admin/historial/libros/{id}(id=${fila.prestamo.libro.id})}" th:text="${fila.prestamo.libro.titulo}"></a><br><code th:text="${fila.prestamo.libro.codigoBarras}"></code></td><td>Solicitud: <span th:text="${#temporals.format(fila.prestamo.fechaSolicitud,'dd/MM/yyyy')}"></span><br>Entrega: <span th:text="${fila.prestamo.fechaPrestamo == null ? 'No entregado' : #temporals.format(fila.prestamo.fechaPrestamo,'dd/MM/yyyy')}"></span><br>Límite: <span th:text="${fila.prestamo.fechaLimiteDevolucion == null ? 'Sin fecha límite' : #temporals.format(fila.prestamo.fechaLimiteDevolucion,'dd/MM/yyyy')}"></span></td><td th:text="${fila.prestamo.estado}"></td><td th:text="${fila.prestamo.fechaLimiteDevolucion == null ? 'Sin fecha límite' : fila.diasAtraso + ' días'}"></td><td><span th:if="${fila.incidencias.empty}">Sin incidencias</span><span th:each="i : ${fila.incidencias}" th:text="${i.tipo + ' · ' + i.estado}"></span></td></tr></tbody></table></div><p><a th:href="@{/admin/historial/lectores}">Volver a lectores</a></p></main></body></html>
