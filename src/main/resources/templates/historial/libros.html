<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragmentos :: cabecera('Historial de libros')}"></head><body><header th:replace="~{fragmentos :: encabezado}"></header><main class="contenido"><div class="resumen"><h1>Historial de libros</h1><a th:href="@{/admin/libros}">Administrar ejemplares</a></div><form class="acciones" method="get"><label>Texto <input class="form-control" name="texto" th:value="${texto}"></label><select name="filtro"><option value="todos">Título, autor o código</option><option value="titulo">Título</option><option value="autor">Autor</option><option value="codigo">Código</option></select><button class="boton">Buscar</button></form><p th:if="${resultados.empty}">No hay ejemplares que coincidan.</p><div class="tabla-contenedor table-responsive" th:unless="${resultados.empty}"><table class="table align-middle mb-0"><thead><tr><th>Título</th><th>Autor</th><th>Código</th><th></th></tr></thead><tbody><tr th:each="libro : ${resultados.content}"><td th:text="${libro.titulo}"></td><td th:text="${libro.autor ?: 'Sin autor'}"></td><td th:text="${libro.codigoBarras}"></td><td><a th:href="@{/admin/historial/libros/{id}(id=${libro.id})}">Ver historial</a></td></tr></tbody></table></div></main></body></html>
