<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragmentos :: cabecera('Historial de lectores')}"></head><body><header th:replace="~{fragmentos :: encabezado}"></header><main class="contenido"><div class="resumen"><h1>Historial de lectores</h1><a th:href="@{/admin/prestamos}">Préstamos</a></div><form class="acciones" method="get"><label>Matrícula o nombre <input class="form-control" name="texto" th:value="${texto}"></label><button class="boton">Buscar</button></form><p th:if="${resultados.empty}">No hay lectores que coincidan.</p><div class="tabla-contenedor table-responsive" th:unless="${resultados.empty}"><table class="table align-middle mb-0"><thead><tr><th>Nombre</th><th>Matrícula</th><th>Correo</th><th></th></tr></thead><tbody><tr th:each="lector : ${resultados.content}"><td th:text="${lector.nombreCompleto}"></td><td th:text="${lector.matricula}"></td><td th:text="${lector.correoInstitucional}"></td><td><a th:href="@{/admin/historial/lectores/{id}(id=${lector.id})}">Ver ficha</a></td></tr></tbody></table></div><nav class="paginacion" th:if="${resultados.totalPages > 1}"><a th:if="${resultados.hasPrevious()}" th:href="@{/admin/historial/lectores(texto=${texto},pagina=${resultados.number-1})}">Anterior</a><span th:text="|${resultados.number + 1} de ${resultados.totalPages}|"></span><a th:if="${resultados.hasNext()}" th:href="@{/admin/historial/lectores(texto=${texto},pagina=${resultados.number+1})}">Siguiente</a></nav></main></body></html>
